name: Update latest X post

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"  # hourly (UTC)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest X post via API and write assets/latest-x.html
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
        run: |
          python3 - << 'PY'
          import os, json, html, urllib.request, urllib.parse

          bearer = (os.environ.get("X_BEARER_TOKEN") or "").strip()
          username = (os.environ.get("X_USERNAME") or "yweng30").strip()
          if not bearer:
            raise SystemExit("Missing GitHub secret: X_BEARER_TOKEN")

          def api_get(url):
            req = urllib.request.Request(url)
            req.add_header("Authorization", f"Bearer {bearer}")
            req.add_header("User-Agent", "latest-x-post-github-action/1.0")
            with urllib.request.urlopen(req, timeout=20) as r:
              return json.loads(r.read().decode("utf-8"))

          # username -> user id
          u = api_get(f"https://api.x.com/2/users/by/username/{urllib.parse.quote(username)}")
          user_id = u["data"]["id"]

          # latest original post (exclude replies/retweets)
          t = api_get(
            f"https://api.x.com/2/users/{user_id}/tweets"
            f"?max_results=5&exclude=retweets,replies&tweet.fields=created_at"
          )
          if "data" not in t or not t["data"]:
            raise SystemExit("No original posts found (maybe only replies/retweets).")

          latest = t["data"][0]
          post_id = latest["id"]
          text = (latest.get("text") or "").strip()
          created_at = latest.get("created_at") or ""
          link = f"https://twitter.com/{username}/status/{post_id}"

          out = f"""
          <div class="latest-x-card">
            <div class="latest-x-header">
              <span class="latest-x-label">Latest on X</span>
              <a class="latest-x-link" href="{html.escape(link)}" target="_blank" rel="noopener">Open</a>
            </div>
            <div class="latest-x-text">{html.escape(text)}</div>
            <div class="latest-x-date">{html.escape(created_at)}</div>
          </div>
          """.strip()

          os.makedirs("assets", exist_ok=True)
          with open("assets/latest-x.html", "w", encoding="utf-8") as f:
            f.write(out)
          print("Wrote assets/latest-x.html")
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/latest-x.html
          git diff --staged --quiet || git commit -m "Update latest X post"
          git push
