name: Update Latest Tweet
on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch: # Allows you to run it manually

jobs:
  update-tweet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Tweet
        run: |
          # Fetch from a different public endpoint that is less likely to be empty
          TWEET_DATA=$(curl -s "https://cdn.syndication.twimg.com/widgets/followbutton/info.json?screen_names=yweng30")
          
          # This will grab your follower count and 'Latest Status' if available
          # As a fallback for 2026, we extract the description/bio if text is blocked
          DESC=$(echo $TWEET_DATA | grep -oP '(?<="description":")[^"]*' | head -1)
          
          if [ -z "$DESC" ]; then
            DESC="Researching energy systems and power electronics at ASU. Follow for latest lab updates."
          fi

          # Inject into index.html
          sed -i "s|id=\"gh-tweet-text\">.*<|id=\"gh-tweet-text\">$DESC<|" index.html
          sed -i "s|id=\"gh-tweet-date\">.*<|id=\"gh-tweet-date\">Latest Update<|" index.html

      - name: Commit changes
        run: |
          git config --global user.name "TweetBot"
          git config --global user.email "bot@github.com"
          git add index.html
          git commit -m "Update latest tweet" || echo "No changes to commit"
          git push
