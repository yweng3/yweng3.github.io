name: Update latest tweet embed (no API, scrape)

on:
  workflow_dispatch:
  schedule:
    - cron: "15 15 * * *"  # daily UTC

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update index.html by scraping latest status id
        env:
          USERNAME: yweng30
          INDEX_FILE: index.html
        run: |
          set -euo pipefail

          # Fetch profile HTML (may fail if X blocks/changes)
          HTML=$(curl -fsSL "https://x.com/${USERNAME}")

          # Extract first /<user>/status/<id>
          STATUS_PATH=$(echo "$HTML" | grep -oE "/${USERNAME}/status/[0-9]{10,}" | head -n 1 || true)
          if [ -z "$STATUS_PATH" ]; then
            echo "Could not extract status id from profile HTML. X may be blocking or HTML changed."
            exit 1
          fi

          TWEET_ID=$(echo "$STATUS_PATH" | grep -oE "[0-9]{10,}" | head -n 1)
          NEW_URL="https://twitter.com/${USERNAME}/status/${TWEET_ID}?ref_src=twsrc%5Etfw"
          echo "Latest tweet url: $NEW_URL"

          # Replace the href inside the first twitter-tweet embed block
          perl -0777 -i -pe "s{(<blockquote\\s+class=\"twitter-tweet\"[^>]*>\\s*<a\\s+href=\")[^\"]*(\"[^>]*>\\s*</a>\\s*</blockquote>)}{\$1$NEW_URL\$2}is" "$INDEX_FILE"

      - name: Commit & push if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update latest tweet embed"
          git push
