name: Update latest X post

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (UTC)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest post and write assets/latest-x.html
        run: |
          python3 - << 'PY'
          import html, re, urllib.request
          from xml.etree import ElementTree as ET

          USER = "xiaopi41955739"

          rss_candidates = [
            f"https://nitter.poast.org/{USER}/rss",
            f"https://nitter.privacydev.net/{USER}/rss",
            f"https://nitter.it/{USER}/rss",
            f"https://nitter.fdn.fr/{USER}/rss",
            f"https://nitter.1d4.us/{USER}/rss",
            f"https://twiiit.com/{USER}/rss",   # sometimes works
          ]

          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36"

          def fetch(url):
            req = urllib.request.Request(
              url,
              headers={
                "User-Agent": UA,
                "Accept": "application/rss+xml, application/xml;q=0.9, text/xml;q=0.8, */*;q=0.1",
              },
            )
            with urllib.request.urlopen(req, timeout=20) as r:
              return r.read()

          xml = None
          last_err = None
          last_preview = ""

          for url in rss_candidates:
            try:
              data = fetch(url)
              preview = data[:300].decode("utf-8", errors="replace").strip()
              # reject empty or HTML responses
              if not preview:
                raise RuntimeError("Empty response body")
              low = preview.lower()
              if low.startswith("<!doctype html") or "<html" in low:
                raise RuntimeError(f"Got HTML instead of RSS/XML. Preview: {preview[:120]}")
              if "<rss" not in low and "<?xml" not in low:
                raise RuntimeError(f"Doesn't look like RSS/XML. Preview: {preview[:120]}")
              xml = data
              print(f"Fetched RSS from: {url}")
              break
            except Exception as e:
              last_err = e
              last_preview = preview if 'preview' in locals() else ""
              print(f"Failed RSS source {url}: {e}")

          if xml is None:
            raise SystemExit(f"All RSS sources failed. Last error: {last_err}. Last preview: {last_preview[:200]}")

          root = ET.fromstring(xml)
          item = root.find("./channel/item")
          if item is None:
            raise SystemExit("No items found in RSS feed.")

          title = (item.findtext("title") or "").strip()
          link  = (item.findtext("link") or "").strip()
          pub   = (item.findtext("pubDate") or "").strip()

          title = re.sub(rf"^{re.escape(USER)}\s*:\s*", "", title, flags=re.I).strip()

          def esc(s): return html.escape(s)

          out = f"""
          <div class="latest-x-card">
            <div class="latest-x-header">
              <span class="latest-x-label">Latest on X</span>
              <a class="latest-x-link" href="{esc(link)}" target="_blank" rel="noopener">Open</a>
            </div>
            <div class="latest-x-text">{esc(title)}</div>
            <div class="latest-x-date">{esc(pub)}</div>
          </div>
          """.strip()

          import os
          os.makedirs("assets", exist_ok=True)
          with open("assets/latest-x.html", "w", encoding="utf-8") as f:
            f.write(out)

          print("Wrote assets/latest-x.html")
          PY


      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/latest-x.html
          git diff --staged --quiet || git commit -m "Update latest X post"
          git push
