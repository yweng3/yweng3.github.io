name: Update latest tweet embed

on:
  schedule:
    - cron: "10 9 * * *"  # daily at 09:10 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-latest-tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update index.html using Nitter RSS (no API)
        env:
          USERNAME: yweng30
          INDEX_HTML: index.html
        run: |
          set -euo pipefail

          python - <<'PY'
          import os, re
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          username = os.environ.get("USERNAME", "yweng30")
          index_path = Path(os.environ.get("INDEX_HTML", "index.html"))

          nitter_candidates = [
              f"https://nitter.net/{username}/rss",
              f"https://nitter.poast.org/{username}/rss",
              f"https://nitter.privacydev.net/{username}/rss",
          ]

          def fetch(url: str) -> str:
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0 (GitHubActionsTweetFetcher/1.0)"}
              )
              with urllib.request.urlopen(req, timeout=20) as resp:
                  return resp.read().decode("utf-8", errors="replace")

          def latest_tweet_id() -> str:
              last_err = None
              for url in nitter_candidates:
                  try:
                      xml_text = fetch(url)
                      root = ET.fromstring(xml_text)
                      item = root.find("./channel/item")
                      if item is None:
                          raise RuntimeError("No <item> in RSS")
                      link = item.findtext("link", default="")
                      m = re.search(r"/status/(\d+)", link)
                      if not m:
                          raise RuntimeError(f"Cannot parse tweet id from link: {link}")
                      return m.group(1)
                  except Exception as e:
                      last_err = e
                      continue
              raise RuntimeError(f"All Nitter instances failed. Last error: {last_err}")

          tid = latest_tweet_id()
          print("Latest tweet ID:", tid)

          if not index_path.exists():
              raise FileNotFoundError(f"{index_path} not found")

          html = index_path.read_text(encoding="utf-8")

          # Primary: match your exact form with ?ref_src=twsrc%5Etfw
          pattern = rf'(https://twitter\.com/{re.escape(username)}/status/)(\d+)(\?ref_src=twsrc%5Etfw)'
          new_html, n = re.subn(pattern, rf"\g<1>{tid}\g<3>", html)

          # Fallback: match any status/<digits> for that username (first occurrence)
          if n == 0:
              pattern2 = rf'(https://twitter\.com/{re.escape(username)}/status/)(\d+)'
              new_html, n2 = re.subn(pattern2, rf"\g<1>{tid}", html, count=1)
              if n2 == 0:
                  raise RuntimeError("No matching twitter status URL found in index.html")
              n = n2

          if new_html != html:
              index_path.write_text(new_html, encoding="utf-8")
              print("index.html updated.")
          else:
              print("index.html already up to date.")
          PY

      - name: Commit & push if changed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: update latest tweet embed"
          git push
