name: Update Latest Tweet
on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch: # Allows you to run it manually

jobs:
  update-tweet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Tweet
        run: |
          # We use a public 'unoffical' API that doesn't require login for public profiles
          TWEET_DATA=$(curl -s "https://syndication.twitter.com/srv/timeline-profile/screen-name/yweng30")
          TEXT=$(echo $TWEET_DATA | grep -oP '(?<="text":")[^"]*' | head -1)
          DATE=$(echo $TWEET_DATA | grep -oP '(?<="created_at":")[^"]*' | head -1)
          
          # Inject into index.html
          sed -i "s/id=\"gh-tweet-text\">.*</id=\"gh-tweet-text\">$TEXT</" index.html
          sed -i "s/id=\"gh-tweet-date\">.*</id=\"gh-tweet-date\">$DATE</" index.html

      - name: Commit changes
        run: |
          git config blobal user.name "TweetBot"
          git config global user.email "bot@github.com"
          git add index.html
          git commit -m "Update latest tweet" || exit 0
          git push
